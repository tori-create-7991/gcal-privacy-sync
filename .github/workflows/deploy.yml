name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # step-level `if` は自身の env を参照できないため、有無フラグのみ job-level に置く
      # (secret 本体は注入ステップにだけ渡し、他ステップ・npm パッケージから見せない)
      HAS_SYNC_PAIRS: ${{ secrets.SYNC_PAIRS_JSON != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create .clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Create .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: Inject calendar sync pairs from secret
        if: ${{ env.HAS_SYNC_PAIRS == 'true' }}
        env:
          SYNC_PAIRS_JSON: ${{ secrets.SYNC_PAIRS_JSON }}
        run: node scripts/inject-sync-pairs.js

      - name: Push to Google Apps Script
        run: clasp push --force

      # 注: 組織のGoogle Workspaceではデプロイ権限が制限されている場合があります
      # その場合はGASエディタから手動でデプロイしてください
      # - name: Deploy
      #   run: clasp deploy --description "Auto deploy from GitHub Actions"
